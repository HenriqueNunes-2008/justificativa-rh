<div
    class="modal"
    id="loginModal">

    <div class="modal-content">

        <button
            class="fechar-modal"
            id="fecharLogin">

            &times;

        </button>

        <h2>

            Login Administrativo

        </h2>

        <form
            method="POST"
            action="{{ url_for('auth.login') }}">

            <input
                type="email"
                name="email"
                placeholder="E-mail"
                required>

            <div class="password">

                <input
                    type="password"
                    id="loginSenha"
                    name="senha"
                    placeholder="Senha"
                    required>

                <i
                    class="fa-solid fa-eye toggle-password"
                    data-target="loginSenha">

                </i>

            </div>

            <button
                type="submit"
                class="btn-principal">

                Entrar

            </button>

        </form>

        <p>

            Não possui cadastro?

            <a
                href="#"
                id="abrirCadastro">

                Cadastre-se

            </a>

        </p>

        <p>

            <a
                href="{{ url_for('justificativas.index', login='1', recuperacao='1') }}"
                id="abrirRecuperacao">

                Esqueci minha senha

            </a>

        </p>

    </div>

</div>

<div
    class="modal"
    id="recuperacaoModal">

    <div class="modal-content">

        <button
            class="fechar-modal"
            id="fecharRecuperacao">

            &times;

        </button>

        <h2>

            Redefinir senha

        </h2>

        <p>

            Seu pedido de alteração de senha será enviado ao administrador de TI.

        </p>

        <form
            method="POST"
            action="{{ url_for('auth.solicitar_redefinicao') }}">

            <input
                type="email"
                name="email"
                placeholder="E-mail cadastrado"
                required>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn-secundario"
                    id="voltarLoginRecuperacao">

                    Voltar

                </button>

                <button
                    type="submit"
                    class="btn-principal">

                    Enviar

                </button>

            </div>

        </form>

    </div>

</div>
